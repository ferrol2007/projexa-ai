<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Booking Confirmation</title>
<style>
  body {
    font-family:'Segoe UI',sans-serif;
    margin:0;
    background:url('https://images.unsplash.com/photo-1517602302552-471fe67acf66?ixlib=rb-4.0.3&auto=format&fit=crop&w=1500&q=80') no-repeat center center fixed;
    background-size:cover;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }
  .ticket {
    background:rgba(0,0,0,0.5); /* transparent box */
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.6);
    width:420px;
    padding:25px;
    text-align:center;
    backdrop-filter: blur(6px); /* frosted-glass effect */
  }
  header {
    background: linear-gradient(90deg, #fd5001, #ff00ff, #00ffff, #00ff00);
    background-size: 300% 300%;
    animation: gradientMove 8s ease infinite;
    color:#fff;
    padding:12px;
    font-size:20px;
    border-radius:10px;
    margin-bottom:20px;
    text-shadow:1px 1px 3px rgba(0,0,0,0.8);
  }
  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  h2 { color:#ffd700; margin-bottom:15px; } /* gold accent */
  .details p {
    margin:8px 0;
    font-size:16px;
  }
  .booking-id {
    font-weight:bold;
    color:#00ffcc; /* neon accent */
    margin-bottom:15px;
  }
  button {
    margin-top:20px;
    background: linear-gradient(90deg, #fd5001, #ff00ff, #00ffff, #00ff00);
    background-size: 300% 300%;
    animation: gradientMove 8s ease infinite;
    color:#fff;
    border:none;
    padding:12px 25px;
    border-radius:25px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
    text-shadow:1px 1px 3px rgba(0,0,0,0.8);
  }
  button:hover { opacity:0.85; }
</style>
</head>
<body>
  <div class="ticket">
    <header>🎉 Booking Confirmed</header>
    <h2>Your Movie Ticket</h2>
    <div class="booking-id" id="bookingId"></div>
    <div class="details" id="details"></div>
    <button onclick="window.location.href='movies.html'">Back to Movies</button>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const movie = params.get("movie");
  const seats = params.get("seats");
  const format = params.get("format");
  const sound = params.get("sound");
  const timing = params.get("timing");

  // Generate a simple booking ID
  const bookingId = "BK" + Math.floor(Math.random() * 1000000);
  document.getElementById("bookingId").innerText = "Booking ID: " + bookingId;

  document.getElementById("details").innerHTML = `
    <p><strong>Movie:</strong> ${movie}</p>
    <p><strong>Seats:</strong> ${seats}</p>
    <p><strong>Format:</strong> ${format}</p>
    <p><strong>Sound:</strong> ${sound}</p>
    <p><strong>Timing:</strong> ${timing}</p>
  `;
</script>
</body>
</html>
