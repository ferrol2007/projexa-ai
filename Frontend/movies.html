<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CineBook – Movies</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--red:#E50914;--red3:#FF1F2D;
--dark:#141414;--surface:#1F1F1F;--surface2:#2A2A2A;
--text:#FFFFFF;--text2:#A3A3A3;--text3:#606060;
}
body{font-family:'Segoe UI',sans-serif;background:var(--dark);color:var(--text);min-height:100vh}
nav{position:sticky;top:0;background:#1A1A1A;padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:26px;font-weight:900;color:var(--red);cursor:pointer}
.logo span{color:var(--text)}
.nav-link{background:none;border:none;color:var(--text2);padding:7px 14px;cursor:pointer}
.nav-link.active{color:var(--text)}
.btn-outline{background:none;border:1px solid #ccc;color:var(--text);padding:7px 18px;cursor:pointer}
.btn-red{background:var(--red);border:none;color:var(--text);padding:7px 18px;cursor:pointer}
.hero{position:relative;height:400px;display:flex;align-items:flex-end;background:#000}
.hero-content{padding:40px;width:60%}
.hero-title{font-size:40px;font-weight:900}
.hero-title .accent{color:var(--red)}
.hero-sub{font-size:16px;color:var(--text2);margin-bottom:22px}
.hero-search{display:flex;max-width:540px;background:#222;border-radius:4px;overflow:hidden}
.hero-search input{flex:1;background:none;border:none;color:var(--text);padding:13px}
.search-btn{background:var(--red);border:none;color:#fff;padding:13px 22px;cursor:pointer}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:20px}
.card{background:var(--surface);border-radius:4px;overflow:hidden}
.card-poster img{width:100%;height:270px;object-fit:cover}
.card-info{padding:12px;background:var(--surface2)}
.card-title{font-size:13px;font-weight:700}
.card-meta{font-size:11px;color:var(--text3)}
.book-btn{background:var(--red);border:none;color:#fff;font-size:10px;font-weight:800;padding:6px 14px;cursor:pointer}
</style>
</head>
<body>

<nav>
  <div class="logo">CINE<span>BOOK</span></div>
  <div>
    <button class="nav-link active">Movies</button>
    <button class="nav-link">Live Shows</button>
  </div>
  <div>
    <button class="btn-outline" id="userEmailBtn">Sign In</button>
    <button class="btn-red">Join Free</button>
  </div>
</nav>

<!-- HOME -->
<div id="home-screen">
  <div class="hero">
    <div class="hero-content">
      <div class="hero-title">Watch.<br>Experience.<br><span class="accent">Book.</span></div>
      <div class="hero-sub">Movies, concerts & live shows — your next experience is one click away</div>
      <div class="hero-search">
        <input type="text" id="search-input" placeholder="Search movies...">
        <button class="search-btn" onclick="filterContent()">Search</button>
      </div>
    </div>
  </div>
  <div class="cards-grid" id="movies-grid"></div>
</div>

<script>
const API_KEY = "b0da81abb41f41a7d0c0b80d4ac38051";
const API_URL = `https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=en-US&page=1`;

// Show Gmail from localStorage
window.onload = () => {
  const email = localStorage.getItem("userEmail");
  if(email){
    document.getElementById("userEmailBtn").innerText = email;
  }
};

let allMovies = [];

async function loadMovies() {
  try {
    const response = await fetch(API_URL);
    const data = await response.json();
    allMovies = data.results;
    renderMovies(allMovies);
  } catch (err) {
    console.error("Error fetching movies:", err);
  }
}
loadMovies();

function renderMovies(movies){
  const moviesContainer = document.getElementById("movies-grid");
  moviesContainer.innerHTML = "";
  movies.forEach(movie => {
    const card = document.createElement("div");
    card.classList.add("card");
    card.innerHTML = `
      <div class="card-poster">
        <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}">
      </div>
      <div class="card-info">
        <div class="card-title">${movie.title}</div>
        <div class="card-meta">Rating: ${movie.vote_average}</div>
        <button class="book-btn" onclick="goToSeatBooking('${movie.title}')">Book Now</button>
      </div>
    `;
    moviesContainer.appendChild(card);
  });
}

// Redirect to seat_booking.html with movie title
function goToSeatBooking(title){
  window.location.href = "seat_booking.html?movie=" + encodeURIComponent(title);
}

// Search filter
function filterContent(){
  const query = document.getElementById("search-input").value.toLowerCase();
  const filtered = allMovies.filter(m => m.title.toLowerCase().includes(query));
  renderMovies(filtered);
}
</script>

</body>
</html>
