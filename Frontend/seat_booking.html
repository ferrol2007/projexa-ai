<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seat Booking</title>
<style>
  body {
    font-family:'Segoe UI',sans-serif;
    margin:0;
    background:url('https://images.unsplash.com/photo-1517602302552-471fe67acf66?ixlib=rb-4.0.3&auto=format&fit=crop&w=1500&q=80') no-repeat center center fixed;
    background-size:cover;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }
  .container {
    background:rgba(0,0,0,0.5);
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.6);
    width:80%;
    max-width:700px;
    padding:25px;
    text-align:center;
    backdrop-filter: blur(6px);
  }
  header {
    background: linear-gradient(90deg, #fd5001, #ff00ff, #00ffff, #00ff00);
    background-size: 300% 300%;
    animation: gradientMove 8s ease infinite;
    color:#fff;
    padding:15px;
    text-align:center;
    font-size:22px;
    border-radius:10px;
    margin-bottom:20px;
    text-shadow:1px 1px 3px rgba(0,0,0,0.8);
  }
  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  h2 { color:#ffd700; }
  .screen {
    background:#333;
    color:#fff;
    padding:8px;
    margin:20px auto;
    width:60%;
    border-radius:5px;
    text-align:center;
    font-weight:bold;
  }
  .seats {
    display:grid;
    grid-template-columns: repeat(10, 40px);
    gap:10px;
    justify-content:center;
    margin:20px auto;
    max-width:500px;
  }
  .seat {
    width:40px;
    height:40px;
    background:#ddd;
    border-radius:5px;
    cursor:pointer;
    transition:0.3s;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:#000;
  }
  .seat.selected { background:#fd5001; color:#fff; }
  .seat.booked { background:#555; color:#fff; cursor:not-allowed; }
  .options { margin:20px; }
  .options label { margin:0 10px; font-weight:bold; }
  button {
    background: linear-gradient(90deg, #fd5001, #ff00ff, #00ffff, #00ff00);
    background-size: 300% 300%;
    animation: gradientMove 8s ease infinite;
    color:#fff;
    border:none;
    padding:12px 25px;
    border-radius:25px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
    text-shadow:1px 1px 3px rgba(0,0,0,0.8);
  }
  button:hover { opacity:0.85; }
  .points {
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
    color:#ffd700;
  }
</style>
</head>
<body>
  <div class="container">
    <header id="movieTitle">🎬 Seat Booking</header>
    <h2>Select Your Seats</h2>
    <div class="screen">SCREEN</div>
    <div class="seats" id="seatGrid"></div>
    <div class="points" id="points">Points: 0</div>
    <div class="options">
      <label>Format:
        <select id="format"><option>2D</option><option>3D</option></select>
      </label>
      <label>Sound:
        <select id="sound"><option>Dolby Atmos</option><option>IMAX DTS</option><option>Surround 7.1</option></select>
      </label>
      <label>Timing:
        <select id="timing"><option>10:00 AM</option><option>1:00 PM</option><option>4:00 PM</option><option>7:00 PM</option><option>10:00 PM</option></select>
      </label>
    </div>
    <button onclick="confirmBooking()">Confirm Booking</button>
  </div>

<script>
  // Get movie name from URL
  const params = new URLSearchParams(window.location.search);
  const movie = params.get("movie") || "Unknown Movie";
  document.getElementById("movieTitle").innerText = "🎬 " + movie + " – Seat Booking";

  // Generate seat grid
  const seatGrid = document.getElementById("seatGrid");
  for(let i=1;i<=50;i++){
    const seat=document.createElement("div");
    seat.className="seat";
    seat.innerText=i;
    seat.onclick=()=>{  
      if(!seat.classList.contains("booked")) {
        seat.classList.toggle("selected");
        updatePoints();
      }
    };
    seatGrid.appendChild(seat);
  }

  // Update points based on selected seats
  function updatePoints(){
    const selectedSeats = document.querySelectorAll(".seat.selected").length;
    const points = selectedSeats * 10;
    document.getElementById("points").innerText = "Points: " + points;
    localStorage.setItem("userPoints", points); // store points for later use
  }

  // Confirm booking → redirect to confirmation page
  function confirmBooking(){
    const selected=[...document.querySelectorAll(".seat.selected")].map(s=>s.innerText);
    const format=document.getElementById("format").value;
    const sound=document.getElementById("sound").value;
    const timing=document.getElementById("timing").value;

    if(selected.length===0){
      alert("Please select at least one seat!");
      return;
    }

    const bookingURL=`confirmation.html?movie=${encodeURIComponent(movie)}&seats=${encodeURIComponent(selected.join(","))}&format=${encodeURIComponent(format)}&sound=${encodeURIComponent(sound)}&timing=${encodeURIComponent(timing)}`;
    window.location.href=bookingURL;
  }
</script>
</body>
</html>
