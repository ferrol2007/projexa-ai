<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cine Booking – Login</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#7E354D,#fd5001,#f5bc00);
    margin:0;height:100vh;display:flex;justify-content:center;align-items:center;
  }
  .box {
    background:rgba(0,0,0,0.85);padding:30px;border-radius:12px;width:380px;
    text-align:center;color:#fff;box-shadow:0 0 20px #000;
  }
  h2 {
    margin-bottom:20px;font-size:28px;font-weight:bold;
    background:linear-gradient(90deg,#fd5001,#f5bc00,#fff);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    text-shadow:0 0 12px rgba(255,0,0,0.8);
  }
  input,button {width:100%;padding:10px;margin:8px 0;border:none;border-radius:6px;font-size:14px;}
  input{background:#111;color:#fff;}
  input:focus{outline:none;border:2px solid #fd5001;}
  button{background:#fd5001;color:#fff;font-weight:bold;cursor:pointer;}
  button:hover{background:#f5bc00;box-shadow:0 0 10px #f5bc00;}
  .toggle{margin-top:10px;font-size:13px;}
  .toggle a{color:#f5bc00;cursor:pointer;text-decoration:underline;}
  .forgot{margin-top:8px;font-size:12px;}
  .forgot a{color:#ffcc00;text-decoration:none;}
  .forgot a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="box">
  <h2>🎬 Cine Booking</h2>

  <!-- Login Form -->
  <form id="loginForm" onsubmit="login(event)">
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit">Login</button>
    <div class="forgot"><a onclick="showReset()">Forgot Password?</a></div>
    <div class="toggle">No account? <a onclick="showSignup()">Sign Up</a></div>
  </form>

  <!-- Signup -->
  <form id="signupForm" style="display:none;">
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <input type="password" placeholder="Confirm Password" required>
    <button type="submit">Sign Up</button>
    <div class="toggle">Have an account? <a onclick="showLogin()">Login</a></div>
  </form>

  <!-- Reset Password -->
  <form id="resetForm" style="display:none;">
    <input type="email" placeholder="Enter your email" required>
    <input type="text" placeholder="Enter reset code" required>
    <button type="submit">Verify Code</button>
    <div class="toggle"><a onclick="showLogin()">Back to Login</a></div>
  </form>
</div>

<script>
  function showSignup(){loginForm.style.display="none";signupForm.style.display="block";resetForm.style.display="none";}
  function showLogin(){loginForm.style.display="block";signupForm.style.display="none";resetForm.style.display="none";}
  function showReset(){loginForm.style.display="none";signupForm.style.display="none";resetForm.style.display="block";}

  function login(event){
    event.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    if(email && password){
      // Save email to localStorage
      localStorage.setItem("userEmail", email);
      // Redirect to home page
      window.location.href = "home.html";
    } else {
      alert("Please enter email and password.");
    }
  }
</script>
</body>
</html>
